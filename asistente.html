      // ============ TRANSCRIPCIÓN LOCAL (Whisper en el navegador) ============
      // 'small' entiende bastante mejor voz baja/susurrada que 'base', a costa de ser más lento.
      const MODELS = {
        base:  { id: 'Xenova/whisper-base' },
        small: { id: 'Xenova/whisper-small' }
      };
      const WHISPER_LANG = 'spanish';
      const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
      let curModel = 'small';
      let enhanceOn = true;
      try {
        const m = localStorage.getItem('stealth-asist-model');
        if (m && MODELS[m]) curModel = m;
        enhanceOn = localStorage.getItem('stealth-asist-enhance') !== '0';
      } catch (e) {}
      const asrCache = {};
      let asrQueue = Promise.resolve();

      function loadAsr(key) {
        key = key || curModel;
        if (!asrCache[key]) {
          asrCache[key] = (async () => {
            setStatus('🧠 Cargando modelo de voz (' + key + ')…');
            const { pipeline, env } = await import(TRANSFORMERS_URL);
            env.allowLocalModels = false;
            const p = await pipeline('automatic-speech-recognition', MODELS[key].id, {
              progress_callback: (info) => {
                if (info && info.status === 'progress' && typeof info.progress === 'number') {
                  setStatus('🧠 Modelo de voz ' + Math.round(info.progress) + '%');
                }
              }
            });
            setLink();
            return p;
          })();
          asrCache[key].catch(() => { delete asrCache[key]; setStatus('⚠️ Sin modelo de voz', 5000); });
        }
        return asrCache[key];
      }

      async function dataUrlToFloat32(dataUrl) {
        const buf = await (await fetch(dataUrl)).arrayBuffer();
        const AC = window.AudioContext || window.webkitAudioContext;
        const ac = new AC({ sampleRate: 16000 });
        try {
          const audio = await ac.decodeAudioData(buf);
          return audio.getChannelData(0);
        } finally { try { ac.close(); } catch {} }
      }

      // Pre-procesado pensado para susurros (voz muy baja, sin tono):
      //  1) filtro pasa-altos ~90 Hz (saca zumbidos/soplidos graves que dominan el pico)
      //  2) recorta el silencio del inicio y del final (ahí Whisper "alucina" textos inventados)
      //  3) sube el volumen para que la voz quede en un nivel que Whisper maneja bien
      function enhanceForWhisper(x) {
        const n = x.length;
        if (n < 8000) return x;
        const y = new Float32Array(n);
        const RC = 1 / (2 * Math.PI * 90), a = RC / (RC + 1 / 16000);
        let py = 0, px = x[0];
        for (let i = 0; i < n; i++) { const xi = x[i]; py = a * (py + xi - px); px = xi; y[i] = py; }

        const F = 320, nf = Math.floor(n / F); // frames de 20 ms
        const rms = new Float32Array(nf);
        for (let f = 0; f < nf; f++) {
          let sum = 0;
          for (let i = f * F, e = i + F; i < e; i++) sum += y[i] * y[i];
          rms[f] = Math.sqrt(sum / F);
        }
        const sorted = Array.from(rms).sort((p, q) => p - q);
        const noise = sorted[Math.floor(nf * 0.1)] || 0;
        const loud = sorted[Math.min(nf - 1, Math.floor(nf * 0.95))] || 0;
        if (loud < 1e-5) return y; // silencio total: nada que realzar

        // recorte de bordes (con 300 ms de margen)
        const thr = Math.max(noise * 3, loud * 0.15, 1e-4);
        let first = -1, last = -1;
        for (let f = 0; f < nf; f++) if (rms[f] >= thr) { if (first < 0) first = f; last = f; }
        let from = 0, to = n;
        if (first >= 0) {
          const pad = 15;
          from = Math.max(0, (first - pad) * F);
          to = Math.min(n, (last + 1 + pad) * F);
          if (to - from < 16000 * 0.6) { from = 0; to = n; } // demasiado corto: no recortar
        }
        const seg = y.subarray(from, to);

        // ganancia: lleva la voz (percentil 95 de RMS) a ~0.1, sin pasar de +32x ni saturar picos
        let peak = 0;
        for (let i = 0; i < seg.length; i++) { const v = Math.abs(seg[i]); if (v > peak) peak = v; }
        let gain = Math.min(32, Math.max(1, 0.1 / loud));
        if (peak > 0) gain = Math.min(gain, 0.95 / peak);
        if (gain <= 1.05) return seg;
        const out = new Float32Array(seg.length);
        for (let i = 0; i < seg.length; i++) out[i] = seg[i] * gain;
        return out;
      }

      // Whisper a veces inventa frases típicas sobre silencio/ruido: se descartan si es todo lo que devolvió
      const HALLUC_RE = /(amara\.org|subt[ií]tulos (realizados|por|de)|gracias por (ver|vernos|su atenci[oó]n|mirar)|suscr[ií]b|dale (like|me gusta)|hasta la pr[oó]xima)/i;
      const FILLER_RE = /^\W*\[?(m[uú]sica|aplausos|silencio|risas)\]?\W*$/i;
      function cleanAsr(t) {
        t = (t || '').replace(/\s+/g, ' ').trim();
        if (!t) return '';
        if (FILLER_RE.test(t)) return '';
        if (t.length < 90 && HALLUC_RE.test(t)) return '';
        return t;
      }

      // Cola: transcribe de a un audio por vez
      function transcribe(dataUrl) {
        const key = curModel, enh = enhanceOn;
        const job = asrQueue.then(async () => {
          const asr = await loadAsr(key);
          let samples = await dataUrlToFloat32(dataUrl);
          if (enh) { try { samples = enhanceForWhisper(samples); } catch (e) { console.warn('realce falló', e); } }
          const out = await asr(samples, { language: WHISPER_LANG, task: 'transcribe', chunk_length_s: 30, stride_length_s: 5 });
          return cleanAsr(out && out.text);
        });
        asrQueue = job.catch(() => {});
        return job;
      }

      // ---- Controles de modelo / realce ----
      const selModel = document.getElementById('selModel');
      const chkEnhance = document.getElementById('chkEnhance');
      selModel.value = curModel;
      chkEnhance.checked = enhanceOn;
      selModel.onchange = () => {
        if (!MODELS[selModel.value]) return;
        curModel = selModel.value;
        try { localStorage.setItem('stealth-asist-model', curModel); } catch (e) {}
        loadAsr(curModel).catch(() => {});
      };
      chkEnhance.onchange = () => {
        enhanceOn = chkEnhance.checked;
        try { localStorage.setItem('stealth-asist-enhance', enhanceOn ? '1' : '0'); } catch (e) {}
      };

      // ============ BLOQUES DE AUDIO EN EL TEXTO GLOBAL ============
      // Cada nota ocupa un bloque "[PREGUNTA NN - hora]\ntexto". Ese bloque vive también en la
      // línea de tiempo (glyphs) para que NO se pierda al corregir una letra o deshacer.
      const PENDING_TXT = '⏳ Transcribiendo...';
      const FAILED_TXT = '⚠️ No se pudo transcribir';
      const NOVOICE_TXT = '(sin voz detectada)';

      function blockStr(marker, txt) { return '\n\n' + marker + '\n' + txt + '\n'; }

      // Reemplaza (o quita si txt === null) el bloque de `marker` dentro de `str`. Devuelve null si no está.
      function patchBlock(str, marker, txt) {
        const idx = str.lastIndexOf(marker);
        if (idx === -1) return null;
        const a = idx + marker.length;
        let end = a;
        if (str[a] === '\n') { const nl = str.indexOf('\n', a + 1); end = nl === -1 ? str.length : nl; }
        if (txt === null) {
          let s0 = idx;
          while (s0 > 0 && str[s0 - 1] === '\n' && idx - s0 < 2) s0--;
          let e0 = end;
          if (str[e0] === '\n') e0++;
          return str.slice(0, s0) + str.slice(e0);
        }
        return str.slice(0, idx) + marker + '\n' + txt + str.slice(end);
      }

      // Inserta/actualiza/quita (txt === null) el bloque SIN tocar lo demás que se haya escrito
      function upsertBlock(marker, txt) {
        const entry = glyphs.find(g => g.isAudioBlock && g.marker === marker);
        const inPrefix = restoredPrefix.includes(marker); // nota de una sesión anterior (texto restaurado)
        if (txt === null) { if (entry) glyphs.splice(glyphs.indexOf(entry), 1); }
        else if (entry) entry.text = txt;
        else if (!inPrefix) glyphs.push({ isAudioBlock: true, marker, text: txt });

        if (inPrefix) { const p = patchBlock(restoredPrefix, marker, txt); if (p !== null) restoredPrefix = p; }

        const v = recognizedText.value;
        let nv = patchBlock(v, marker, txt), appended = false;
        if (nv === null) {
          if (txt === null) nv = v;
          else { nv = v + blockStr(marker, txt); appended = true; }
        }
        if (nv !== v) {
          recognizedText.value = nv;
          if (appended) { try { recognizedText.scrollTop = recognizedText.scrollHeight; } catch (e) {} }
        }
        scheduleSave();
      }


      // ============ ENLACE BIDIRECCIONAL (presencia + resincronización) ============
      const chkAuto = document.getElementById('chkAutoTranscribe');
      const chkAlerts = document.getElementById('chkAlerts');
      try {
        chkAuto.checked = localStorage.getItem('stealth-asist-autotrans') === '1';
        chkAlerts.checked = localStorage.getItem('stealth-asist-alerts') === '1';
      } catch (e) {}
      chkAuto.onchange = () => { try { localStorage.setItem('stealth-asist-autotrans', chkAuto.checked ? '1' : '0'); } catch (e) {} };
      chkAlerts.onchange = () => {
        try { localStorage.setItem('stealth-asist-alerts', chkAlerts.checked ? '1' : '0'); } catch (e) {}
        if (chkAlerts.checked) beep(); // prueba de sonido al activar
      };

      function send(payload) {
        payload.from = CLIENT_ID;
        try { if (bc) bc.postMessage(payload); } catch (e) {}
        try { if (mqttClient && connectedMqtt) mqttClient.publish(TOPIC, JSON.stringify(payload), { qos: 1 }); } catch (e) {}
      }

      function beep() {
        if (!chkAlerts.checked) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          const ac = new AC();
          if (ac.state === 'suspended') ac.resume().catch(() => {});
          const t = ac.currentTime;
          [0, 0.18].forEach((d, i) => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = 'sine'; o.frequency.value = i === 0 ? 880 : 1320;
            g.gain.setValueAtTime(0.0001, t + d);
            g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.14);
            o.connect(g); g.connect(ac.destination);
            o.start(t + d); o.stop(t + d + 0.16);
          });
          setTimeout(() => { try { ac.close(); } catch (e) {} }, 600);
        } catch (e) {}
      }

      let lastSyncSent = 0;
      function requestSync() {
        const now = Date.now();
        if (now - lastSyncSent < 3000) return; // evita tormentas de sync
        lastSyncSent = now;
        send({ type: 'sync_request', haveAudio: audioIds.list(), ts: now });
        setStatus('🔄 Resincronizando…', 2000);
      }
      document.getElementById('btnSync').onclick = () => { lastSyncSent = 0; requestSync(); };

      // Ping periódico: Mago responde "pong" y así sabemos que sigue vivo aunque no dibuje.
      // Si además lleva >15s sin contestar (o nunca lo vimos), se reenvía "hello" para
      // que él reconteste y dispare su resincronización: cubre el caso en que nuestro
      // hello inicial salió antes de que Mago se suscribiera al tópico.
      setInterval(() => {
        send({ type: 'ping', ts: Date.now() });
        if (Date.now() - lastMsgAt > 15000) send({ type: 'hello', ts: Date.now() });
      }, 4000);

      // Re-sincroniza al volver la red o al recuperar la pestaña.
      // Se envía además "hello" para que Mago también nos pida lo que LE falte
      // (sus trazas siguen en su buffer; nuestros audios pueden faltarle a él).
      window.addEventListener('online', () => {
        linkState = 'reconnect'; setLink();
        send({ type: 'hello', ts: Date.now() });
        lastSyncSent = 0; requestSync();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          keepScreenOn(); restoreTitle();
          send({ type: 'hello', ts: Date.now() });
          requestSync();
        }
      });
      // Salida desde bfcache (botón "atrás"): el estado JS queda vivo pero el
      // enlace MQTT pudo morir en segundo plano; se retoma con hello + sync.
      window.addEventListener('pageshow', (e) => {
        if (!e.persisted) return;
        keepScreenOn(); restoreTitle();
        send({ type: 'hello', ts: Date.now() });
        lastSyncSent = 0; requestSync();
      });

      // ============ PERSISTENCIA DE NOTAS DE VOZ (IndexedDB) ============
      // Las notas se guardan en IndexedDB (más capacidad que localStorage para
      // base64) y se restauran al recargar, así un F5 accidental no pierde el audio.
      const NOTE_DB_NAME = 'stealth-asist-notes-v1';
      const NOTE_STORE = 'notes';
      const NOTE_CAP = 30; // se conservan las últimas N notas
      let noteDb = null, noteDbBroken = false;

      function openNoteDb() {
        if (noteDb || noteDbBroken) return Promise.resolve(noteDb);
        return new Promise(resolve => {
          try {
            const req = indexedDB.open(NOTE_DB_NAME, 1);
            req.onupgradeneeded = () => {
              const db = req.result;
              if (!db.objectStoreNames.contains(NOTE_STORE)) db.createObjectStore(NOTE_STORE, { keyPath: 'id' });
            };
            req.onsuccess = () => { noteDb = req.result; resolve(noteDb); };
            req.onerror = () => { noteDbBroken = true; resolve(null); };
          } catch (e) { noteDbBroken = true; resolve(null); }
        });
      }

      async function notePut(note) {
        const db = await openNoteDb(); if (!db || !note || !note.id) return;
        try { db.transaction(NOTE_STORE, 'readwrite').objectStore(NOTE_STORE).put(note); } catch (e) {}
      }
      async function noteDelete(id) {
        const db = await openNoteDb(); if (!db || !id) return;
        try { db.transaction(NOTE_STORE, 'readwrite').objectStore(NOTE_STORE).delete(id); } catch (e) {}
      }
      async function noteGet(id) {
        const db = await openNoteDb(); if (!db || !id) return null;
        return new Promise(resolve => {
          try {
            const req = db.transaction(NOTE_STORE, 'readonly').objectStore(NOTE_STORE).get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      }
      async function noteAll() {
        const db = await openNoteDb(); if (!db) return [];
        return new Promise(resolve => {
          try {
            const req = db.transaction(NOTE_STORE, 'readonly').objectStore(NOTE_STORE).getAll();
            req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
            req.onerror = () => resolve([]);
          } catch (e) { resolve([]); }
        });
      }
      async function noteTrim() {
        const all = await noteAll();
        if (all.length <= NOTE_CAP) return;
        all.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        for (let i = 0; i < all.length - NOTE_CAP; i++) noteDelete(all[i].id);
      }

      function handleAudio(data) {
        if (!data.audioBase64) return;
        // ACK: le confirmo a Mago que este audio llegó (él puede descartarlo del buffer)
        send({ type: 'audio_ack', ackId: data.id, ts: Date.now() });
        // Dedupe: el mismo audio llega por BroadcastChannel y por MQTT
        const noteId = data.id || ('audio_' + data.ts);
        if (!audioIds.remember(noteId)) return;

        audioCounter++;
        audioCount = audioCounter;
        const note = { id: noteId, num: audioCounter, ts: Date.now(), audioBase64: data.audioBase64, color: 'color-default', title: '', text: '' };
        // Diagnóstico del corte (opcional: los mensajes viejos no lo traen)
        if (data.durationMs != null) note.durationMs = data.durationMs;
        if (data.stopReason) note.stopReason = data.stopReason;
        if (data.peakLevel != null) note.peakLevel = data.peakLevel;
        if (data.threshold != null) note.threshold = data.threshold;
        if (Array.isArray(data.levels)) note.levels = data.levels.map(v => Math.round(v * 10000) / 10000);
        notePut(note); noteTrim();
        renderAudioCard(note, { fresh: true });
      }

      // Renderiza una nota (nueva o restaurada). `fresh` = recién recibida de Mago.
      function renderAudioCard(note, opts) {
        const fresh = !!(opts && opts.fresh);
        const own = !!(note.own || (opts && opts.own));
        const num = note.num || 0;
        const numFormatted = num < 10 ? '0' + num : num;
        const timestampStr = new Date(note.ts || Date.now()).toLocaleTimeString();
        const marker = `[PREGUNTA ${numFormatted} - ${timestampStr}]`;

        const card = document.createElement('div');
        card.className = 'audio-card ' + (note.color || 'color-default');
        card.dataset.noteId = note.id;
        card.innerHTML = `
          <div class="audio-card-header">
            <input class="title-input" />
            <span style="display:flex; align-items:center; gap:6px;">
              ${own ? '<span style="font-size:10px; color:#fbbf24; border:1px dashed #92400e; border-radius:4px; padding:1px 5px;">propia</span>' : ''}
              <span style="font-size:10px; opacity:0.6;">${timestampStr}</span>
              <button type="button" class="btn-del-card" title="Eliminar nota">✕</button>
            </span>
          </div>
          <audio controls preload="metadata"></audio>
          <div class="audio-diag" style="display:none; font-size:11px; color:#888;"></div>
          <svg class="audio-levels" width="100%" height="28" viewBox="0 0 120 28" preserveAspectRatio="none" style="display:none; margin-top:4px;"></svg>
          <div class="tr-row">
            <button type="button" class="btn-transcribe">🎙️ Transcribir</button>
            <span class="tr-status"></span>
          </div>
          <textarea class="note-text" rows="3" placeholder="✍️ Escribí acá lo que dice el audio (o transcribilo y corregí). Lo que pongas va directo al texto global."></textarea>
          <div class="tr-alt" style="display:none;"></div>
        `;
        card.querySelector('.title-input').value = note.title || ('Pregunta ' + numFormatted);
        card.querySelector('audio').src = note.audioBase64;
        const btnT = card.querySelector('.btn-transcribe');
        const stEl = card.querySelector('.tr-status');
        const ta = card.querySelector('.note-text');
        const altEl = card.querySelector('.tr-alt');
        const titleInput = card.querySelector('.title-input');
        ta.value = note.text || '';

        // Diagnóstico de corte: solo si el Mago envió esos campos (mensajes viejos sin datos no muestran nada)
        const REASON_TXT = { silence: 'silencio', max: 'máximo', triple: 'triple toque', remote: 'detenido desde el asistente', error: 'error', other: 'otro' };
        if (note.durationMs != null || note.stopReason || note.peakLevel != null || note.threshold != null) {
          const bits = [];
          if (note.durationMs != null) bits.push('⏱ ' + (note.durationMs / 1000).toFixed(1) + ' s');
          if (note.stopReason) bits.push('✂ ' + (REASON_TXT[note.stopReason] || note.stopReason));
          if (note.peakLevel != null) bits.push('🔊 pico ' + Number(note.peakLevel).toFixed(4));
          if (note.threshold != null) bits.push('umbral ' + Number(note.threshold).toFixed(4));
          const diagEl = card.querySelector('.audio-diag');
            diagEl.textContent = bits.join(' · ');
            diagEl.style.display = 'block';
          }

          const svgLevels = card.querySelector('.audio-levels');
          if (Array.isArray(note.levels) && note.levels.length > 0) {
            const levels = note.levels;
            const maxCount = Math.max(1, levels.length);
            const w = 120, h = 28;
            let path = '';
            for (let i = 0; i < levels.length; i++) {
              const x = (i / (maxCount - 1 || 1)) * w;
              const v = Math.max(0, Math.min(1, levels[i] || 0));
              const y = h - v * (h - 2) - 1;
              path += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2);
            }
            let bars = '';
            const barW = maxCount > 1 ? w / maxCount : w;
            for (let i = 0; i < levels.length; i++) {
              const v = Math.max(0, Math.min(1, levels[i] || 0));
              const bh = v * (h - 2);
              bars += '<rect x="' + (i * barW).toFixed(2) + '" y="' + (h - bh - 1).toFixed(2) + '" width="' + (barW * 0.8).toFixed(2) + '" height="' + bh.toFixed(2) + '" fill="#4ade80" opacity="0.4" />';
            }
            const thresh = note.threshold != null ? Math.max(0, Math.min(1, Number(note.threshold))) : null;
            let line = '';
            if (thresh != null) {
              const ty = h - thresh * (h - 2) - 1;
              line = '<line x1="0" y1="' + ty.toFixed(2) + '" x2="' + w + '" y2="' + ty.toFixed(2) + '" stroke="#facc15" stroke-width="1" opacity="0.8" />';
            }
            svgLevels.innerHTML = bars + line;
            svgLevels.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
            svgLevels.style.display = 'block';
          } else {
            svgLevels.style.display = 'none';
          }

        let state = null;   // null | 'pending' | 'failed' | 'empty'
        let lastAsr = '';   // último texto devuelto por Whisper (para saber si el usuario lo editó)
        let dirty = false, typeTimer = null;
        const flat = (t) => (t || '').replace(/\s*\n\s*/g, ' ').trim();
        const setSt = (txt, cls) => { stEl.textContent = txt; stEl.className = 'tr-status' + (cls ? ' ' + cls : ''); };

        // Qué se ve en el texto global para esta nota: lo escrito/transcripto, o el estado actual
        function syncGlobal() {
          const txt = flat(ta.value);
          if (txt) upsertBlock(marker, txt);
          else if (state === 'pending') upsertBlock(marker, PENDING_TXT);
          else if (state === 'failed') upsertBlock(marker, FAILED_TXT);
          else if (state === 'empty') upsertBlock(marker, NOVOICE_TXT);
          else upsertBlock(marker, null);
        }
        function persistText() {
          noteGet(note.id).then(existing => { if (existing) notePut({ ...existing, text: ta.value }); });
        }
        function commitText() { dirty = false; syncGlobal(); persistText(); }

        // Texto manual: se refleja en el texto global mientras escribís (con una pausa corta)
        ta.addEventListener('input', () => {
          dirty = true;
          if (state === 'empty') state = null;
          clearTimeout(typeTimer);
          typeTimer = setTimeout(commitText, 350);
        });
        ta.addEventListener('blur', () => { if (dirty) { clearTimeout(typeTimer); commitText(); } });

        titleInput.addEventListener('change', () => {
          noteGet(note.id).then(existing => { if (existing) notePut({ ...existing, title: titleInput.value }); });
        });

        card.querySelector('.btn-del-card').onclick = (ev) => {
          ev.stopPropagation();
          noteDelete(note.id);
          card.remove();
          if (!audioLogContainer.querySelector('.audio-card')) {
            audioLogContainer.innerHTML = '<div class="audio-card"><i>Esperando notas de voz...</i></div>';
          }
          setStatus('🗑️ Nota eliminada', 1500);
        };

        card.addEventListener('contextmenu', (e) => {
          if (e.target === ta) return; // en el cuadro de texto se deja el menú normal (copiar/pegar)
          e.preventDefault();
          targetAudioCard = card;
          contextMenu.style.left = Math.max(4, Math.min(e.clientX, innerWidth - 190)) + 'px';
          contextMenu.style.top = Math.max(4, Math.min(e.clientY, innerHeight - 160)) + 'px';
          contextMenu.style.display = 'flex';
        });

        if (audioLogContainer.querySelector('i')) audioLogContainer.innerHTML = '';
        // Las nuevas van arriba; las restauradas se insertan arriba de ellas mismas
        // en orden cronológico inverso (la más vieja queda al fondo).
        if (fresh) audioLogContainer.prepend(card);
        else audioLogContainer.appendChild(card);

        // Avisa con insignia/vibración/tono/título solo si es una nota nueva en vivo.
        // Las notas propias (grabadas en la PC) NO generan insignia ni tono.
        if (fresh) {
          if (!own) {
            if (!tabContentAudio.classList.contains('active')) {
              unseenAudio++; updateBadge();
              if (navigator.vibrate) navigator.vibrate(60);
            }
            beep();
            flashTitle(`🎙️ ${numFormatted} · Asistente`);
          }
          setStatus(own ? ('🎙️ Nota propia ' + numFormatted + ' guardada ✅') : ('🎙️ Audio ' + numFormatted + ' recibido ✅'), 2000);
        }

        // Transcripción manual (estilo WhatsApp): evita que Whisper bloquee la interfaz
        btnT.onclick = () => {
          if (btnT.disabled) return;
          btnT.disabled = true;
          btnT.textContent = '⏳ Transcribiendo…';
          state = 'pending';
          setSt('⏳ Transcribiendo…', 'pending');
          altEl.style.display = 'none';
          syncGlobal(); // si no hay texto manual, deja el aviso "Transcribiendo..." en el texto global
          setStatus('🧠 Transcribiendo audio…');
          transcribe(note.audioBase64)
            .then(text => {
              btnT.textContent = '🔄 Re-transcribir';
              btnT.disabled = false;
              if (!text) {
                state = flat(ta.value) ? null : 'empty';
                setSt('(sin voz detectada)', 'failed');
                syncGlobal();
                setStatus('⚠️ Sin voz detectada', 2500);
                return;
              }
              state = null;
              const mine = flat(ta.value);
              if (!mine || mine === lastAsr) {
                // Nada escrito a mano (o es el texto anterior de Whisper): se completa el cuadro
                ta.value = text; lastAsr = flat(text);
                setSt('✅ Transcrito · corregí abajo si hace falta');
                commitText();
              } else {
                // El usuario ya escribió algo: se conserva y se ofrece el texto de Whisper
                lastAsr = flat(text);
                setSt('✅ Transcrito · se conservó tu texto');
                altEl.innerHTML = '<b>Whisper:</b> <span class="alt-txt"></span> <button type="button" class="btn">Usar este</button>';
                altEl.querySelector('.alt-txt').textContent = text;
                altEl.querySelector('button').onclick = () => {
                  ta.value = text; altEl.style.display = 'none';
                  setSt('✅ Texto de Whisper aplicado');
                  commitText();
                };
                altEl.style.display = 'block';
                syncGlobal();
              }
              setStatus('✅ Transcrito', 1500);
            })
            .catch(err => {
              console.error('Transcripción falló:', err);
              state = flat(ta.value) ? null : 'failed';
              setSt('⚠️ No se pudo transcribir', 'failed');
              syncGlobal();
              btnT.textContent = '🔄 Reintentar';
              btnT.disabled = false;
              setStatus('⚠️ Transcripción fallida', 4000);
            });
        };

        // Auto-transcripción opcional (solo notas nuevas en vivo; las restauradas
        // quedan pendientes para revisión manual)
        if (fresh && chkAuto.checked) setTimeout(() => { try { btnT.click(); } catch (e) {} }, 300);
      }

      // Restaura las notas guardadas al abrir la página
      noteAll().then(notes => {
        if (!Array.isArray(notes) || notes.length === 0) return;
        notes.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        for (const n of notes) {
          audioCounter = Math.max(audioCounter, n.num || 0);
          // Marca el ID como visto: si Mago reenvía el audio en un resync
          // (su buffer conserva los últimos 4), no se duplica la tarjeta.
          audioIds.remember(n.id);
          try { renderAudioCard(n, { fresh: false }); } catch (e) {}
        }
        audioCount = audioCounter;
        updateLastAct();
      });

      // ============ GRABACIÓN PROPIA DESDE LA PC (nota local, NO se envía a Mago) ============
      const btnOwnRec = document.getElementById('btnOwnRec');
      let ownRec = null, ownStream = null, ownChunks = null, ownTimer = null, ownStartAt = 0;

      function blobToDataUrl(blob) {
        return new Promise(resolve => {
          try {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => resolve(null);
            r.readAsDataURL(blob);
          } catch (e) { resolve(null); }
        });
      }
      function ownRecResetUi() {
        clearInterval(ownTimer); ownTimer = null;
        btnOwnRec.textContent = '⏺ Grabar';
        btnOwnRec.classList.remove('danger');
      }
      function ownRecRelease() {
        if (ownStream) { try { ownStream.getTracks().forEach(t => t.stop()); } catch (e) {} ownStream = null; }
        ownRec = null; ownChunks = null;
      }
      function ownRecStop() {
        if (!ownRec || ownRec.state === 'inactive') return;
        try { ownRec.stop(); } catch (e) {}
      }

      btnOwnRec.onclick = async () => {
        if (ownRec && ownRec.state !== 'inactive') { ownRecStop(); return; }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setStatus('⚠️ Sin soporte de micrófono', 4000); return; }
        if (typeof MediaRecorder === 'undefined') { setStatus('⚠️ MediaRecorder no disponible', 4000); return; }
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        } catch (e) { setStatus('⚠️ Permiso de micrófono denegado', 4000); return; }
        ownStream = stream;
        ownChunks = [];
        let rec = null;
        try {
          let mime = '';
          try {
            if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
            else if (MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
          } catch (e) {}
          rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
        } catch (e) {
          try { rec = new MediaRecorder(stream); } catch (e2) {
            ownRecRelease();
            setStatus('⚠️ No se pudo iniciar la grabación', 4000); return;
          }
        }
        ownRec = rec;
        rec.ondataavailable = (e) => { if (e.data && e.data.size > 0) ownChunks.push(e.data); };
        rec.onstop = () => {
          const chunks = ownChunks || [];
          const durMs = Date.now() - ownStartAt;
          ownRecResetUi(); ownRecRelease(); // libera el micrófono
          if (!chunks.length) { setStatus('⚠️ Grabación vacía', 3000); return; }
          const type = chunks[0].type || 'audio/webm';
          blobToDataUrl(new Blob(chunks, { type })).then((dataUrl) => {
            if (!dataUrl) { setStatus('⚠️ No se pudo guardar el audio', 4000); return; }
            const id = 'own_' + Date.now();
            if (!audioIds.remember(id)) return;
            audioCounter++; audioCount = audioCounter;
            const note = { id, num: audioCounter, ts: Date.now(), audioBase64: dataUrl, color: 'color-default', title: '', text: '', own: true, durationMs: durMs };
            notePut(note); noteTrim();
            renderAudioCard(note, { fresh: true, own: true }); // misma tarjeta, marcador y guardado; sin alerta sonora/insignia
          });
        };
        rec.start();
        ownStartAt = Date.now();
        btnOwnRec.textContent = '⏹ Detener (0s)';
        btnOwnRec.classList.add('danger');
        ownTimer = setInterval(() => {
          const s = Math.floor((Date.now() - ownStartAt) / 1000);
          btnOwnRec.textContent = '⏹ Detener (' + s + 's)';
          if (s >= 60) ownRecStop(); // corte a los 60 s
        }, 500);
        setStatus('⏺ Grabando… (máx 60 s)', 2500);
      };

      // ============ RESPALDO: exportar / importar texto, notas de voz y memoria de letras ============
      const btnBackup = document.getElementById('btnBackup');
      const btnRestore = document.getElementById('btnRestore');
      const fileRestore = document.getElementById('fileRestore');
      const BACKUP_APP = 'stealth-asistente';

      function pad2(n) { return String(n).padStart(2, '0'); }
      function stampNow() {
        const d = new Date();
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '_' +
               pad2(d.getHours()) + '-' + pad2(d.getMinutes()) + '-' + pad2(d.getSeconds());
      }
      function validMemory(arr) {
        return (Array.isArray(arr) ? arr : []).filter(m => m && typeof m.char === 'string' && Array.isArray(m.points) && m.points.length === 16);
      }

      btnBackup.onclick = async () => {
        try {
          setStatus('💾 Preparando respaldo…');
          const notes = await noteAll();
          notes.sort((a, b) => (a.ts || 0) - (b.ts || 0));
          const data = {
            app: BACKUP_APP, version: 1, exportedAt: new Date().toISOString(),
            session: { text: recognizedText.value, counter: audioCounter, strokes: strokeCount, letterH: LETTER_H },
            notes: notes,
            memory: memory,
            lexicon: lexicon
          };
          const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = 'respaldo-asistente-' + stampNow() + '.json';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 5000);
          setStatus('💾 Respaldo guardado (' + notes.length + ' notas)', 3500);
        } catch (e) {
          console.error('respaldo falló', e);
          setStatus('⚠️ No se pudo crear el respaldo', 4000);
        }
      };

      btnRestore.onclick = () => fileRestore.click();
      fileRestore.onchange = async (e) => {
        const f = e.target.files && e.target.files[0];
        try { e.target.value = ''; } catch (e0) {}
        if (!f) return;
        let data;
        try { data = JSON.parse(await f.text()); }
        catch (err) { alert('El archivo no es un respaldo válido (no se puede leer).'); return; }
        if (!data || data.app !== BACKUP_APP || !data.session || typeof data.session.text !== 'string') {
          alert('Este archivo no parece un respaldo de este asistente.'); return;
        }

        // Notas válidas y cuáles son nuevas (las que ya existen se omiten: nunca se duplican)
        const inNotes = (Array.isArray(data.notes) ? data.notes : []).filter(n =>
          n && typeof n.id === 'string' && typeof n.audioBase64 === 'string' && n.audioBase64.startsWith('data:'));
        const fresh = [];
        for (const n of inNotes) {
          if (audioIds.has(n.id)) continue;
          if (await noteGet(n.id)) continue;
          fresh.push(n);
        }
        const mem = validMemory(data.memory);
        const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'fecha desconocida';
        const omitted = inNotes.length - fresh.length;
        const msg = 'Respaldo del ' + when + '\n\n' +
          '• Texto global: ' + data.session.text.length + ' caracteres (REEMPLAZA el texto actual)\n' +
          '• Notas de voz: ' + fresh.length + ' nuevas' + (omitted ? ' (' + omitted + ' ya estaban y se omiten)' : '') + '\n\n¿Importar?';
        if (!confirm(msg)) return;

        // Copia de seguridad del texto actual por si te arrepentís
        try { localStorage.setItem('stealth-asist-pre-import', JSON.stringify({ text: recognizedText.value, at: Date.now() })); } catch (e1) {}

        // Texto global
        glyphs = []; selectedGlyph = null; correctBar.classList.remove('show');
        restoredPrefix = data.session.text;
        if (restoredPrefix && !/\s$/.test(restoredPrefix)) restoredPrefix += ' ';
        recognizedText.value = restoredPrefix;
        const lh = data.session.letterH;
        if (typeof lh === 'number' && lh >= 30 && lh <= 110) LETTER_H = lh;
        relayout();

        // Notas de voz
        fresh.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        let maxNum = Math.max(audioCounter, data.session.counter || 0);
        for (const n of fresh) {
          maxNum = Math.max(maxNum, n.num || 0);
          audioIds.remember(n.id); // para que un resync de Mago no la repita
          await notePut(n);
          try { renderAudioCard(n, { fresh: false, own: !!n.own }); } catch (er) { console.warn('nota no restaurada', er); }
        }
        audioCounter = maxNum; audioCount = audioCounter;
        noteTrim(); updateLastAct();

        // Memoria de letras (opcional)
        if (mem.length > 0 && confirm('El respaldo trae ' + mem.length + ' ejemplos de la memoria de letras (ahora tenés ' + memory.length + ').\n\nAceptar = reemplazar la memoria actual\nCancelar = dejar la actual')) {
          memory = mem;
          try { localStorage.setItem(LEARN_KEY, JSON.stringify(memory)); } catch (e2) {}
          memoryChanged();
        }

        if (Array.isArray(data.lexicon)) { data.lexicon.forEach(addLexiconWord); }
        scheduleSave();
        setStatus('✅ Respaldo importado (' + fresh.length + ' notas)', 4000);
      };

      // ============ GRABAR CON EL MICRÓFONO DEL CELULAR (control remoto de Mago) ============
      const btnPhoneRec = document.getElementById('btnPhoneRec');
      const phoneRec = { on: false, since: 0, waiting: null, tick: null };

      function paintPhoneRec() {
        if (phoneRec.on) {
          const sec = Math.floor((Date.now() - phoneRec.since) / 1000);
          btnPhoneRec.textContent = '📱⏹ Detener (' + sec + 's)';
          btnPhoneRec.classList.add('danger');
        } else {
          btnPhoneRec.textContent = '📱⏺ Grabar';
          btnPhoneRec.classList.remove('danger');
        }
      }
      function setPhoneRec(on) {
        phoneRec.on = on;
        if (on) {
          phoneRec.since = Date.now();
          if (!phoneRec.tick) phoneRec.tick = setInterval(paintPhoneRec, 500);
        } else {
          clearInterval(phoneRec.tick); phoneRec.tick = null; phoneRec.since = 0;
        }
        paintPhoneRec();
      }
      // Estado que informa el celular: 'recording' | 'idle'
      function onRecState(d) {
        clearTimeout(phoneRec.waiting); phoneRec.waiting = null;
        btnPhoneRec.disabled = false;
        const now = d.state === 'recording';
        if (now !== phoneRec.on) setPhoneRec(now); else paintPhoneRec();
        if (!now && d.reason === 'no-mic') setStatus('⚠️ El celular no pudo abrir el micrófono (¿permiso?)', 5000);
        else if (!now && d.reason === 'error') setStatus('⚠️ El celular no pudo grabar', 5000);
        else if (now) setStatus('📱 Grabando en el celular…', 2000);
        else if (d.reason === 'remote') setStatus('📱 Grabación detenida, esperando el audio…', 3000);
      }
      btnPhoneRec.onclick = () => {
        if (btnPhoneRec.disabled) return;
        const action = phoneRec.on ? 'stop' : 'start';
        btnPhoneRec.disabled = true;
        clearTimeout(phoneRec.waiting);
        phoneRec.waiting = setTimeout(() => {
          phoneRec.waiting = null; btnPhoneRec.disabled = false; paintPhoneRec();
          setStatus('⚠️ El celular no respondió (¿pantalla apagada o sin conexión?)', 5000);
        }, 4000);
        send({ type: 'rec_cmd', id: 'rc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), action: action, ts: Date.now() });
      };

      // ============ AYUDA CONTEXTUAL: sugerencias con diccionario (nunca corrige solo) ============
      const suggestBar = document.getElementById('suggestBar');
      const sgText = document.getElementById('sgText');
      const sgCount = document.getElementById('sgCount');
      const btnUnsure = document.getElementById('btnUnsure');

      function isLetterGlyph(g) { return !!g && !g.isNewline && !g.isSpace && !g.isTextToken && !g.isAudioBlock; }
      function candsOf(g) {
        if (g.fixed || !g.cands || !g.cands.length) return [{ ch: g.char || '?', p: g.fixed ? 1 : 0.9 }];
        return g.cands;
      }
      function readingOf(W) { return W.gs.map(g => g.char || '?').join(''); }

      // Palabras = tandas de letras separadas por espacio / salto de línea / marcas
      function buildWords() {
        const words = []; let cur = null;
        const flush = (term, termIdx) => { if (cur) { cur.term = term; cur.termIdx = termIdx; words.push(cur); cur = null; } };
        for (let i = 0; i < glyphs.length; i++) {
          const g = glyphs[i];
          if (g.isSpace) { flush('space', i); continue; }
          if (!isLetterGlyph(g)) { flush('break', i); continue; }
          if (!cur) cur = { gs: [], idxs: [] };
          cur.gs.push(g); cur.idxs.push(i);
        }
        flush('open', -1);
        return words;
      }

      function scheduleAnalysis() {
        clearTimeout(analysisTimer);
        analysisTimer = setTimeout(analyzeNow, 250);
        clearTimeout(openWordTimer);
        openWordTimer = setTimeout(analyzeNow, 2000);   // la última palabra se evalúa cuando dejás de escribir
      }

      function analyzeNow() {
        analysisTimer = null;
        const found = [];
        if (dict) {
          try {
            const idle = Date.now() - lastGlyphAt >= 1900;
            const words = buildWords();
            const used = new Set();
            // 1) espacios de más: "CO DO" -> "CODO"
            for (let w = 0; w + 1 < words.length; w++) {
              const A = words[w], B = words[w + 1];
              if (A.term !== 'space' || B.idxs[0] !== A.termIdx + 1) continue;
              if (B.term === 'open' && !idle) continue;
              const a = readingOf(A), b = readingOf(B);
              const m = RecoCore.suggestMerge(dict, a, b);
              if (m) {
                found.push({ type: 'merge', key: 'm:' + a + ' ' + b, from: a + ' ' + b, to: m, pos: A.idxs[0], gs: A.gs.concat(B.gs), spaceG: glyphs[A.termIdx] });
                used.add(w); used.add(w + 1);
              }
            }
            // 2) letras mal leídas y palabras pegadas
            for (let w = 0; w < words.length; w++) {
              if (used.has(w)) continue;
              const W = words[w];
              if (W.term === 'open' && !idle) continue;
              const fix = RecoCore.suggestFix(dict, W.gs.map(candsOf));
              if (fix) { found.push({ type: 'fix', key: 'f:' + fix.from + '>' + fix.to, from: fix.from, to: fix.to, pos: W.idxs[0], gs: W.gs }); continue; }
              const parts = RecoCore.suggestSplit(dict, readingOf(W));
              if (parts) {
                const after = []; let cum = 0;
                for (let k = 0; k < parts.length - 1; k++) { cum += parts[k].length; after.push(W.gs[cum - 1]); }
                found.push({ type: 'split', key: 's:' + readingOf(W), from: readingOf(W), to: parts.join(' '), pos: W.idxs[0], gs: W.gs, after });
              }
            }
          } catch (e) { console.warn('análisis falló', e); }
        }
        found.sort((a, b) => a.pos - b.pos);
        suggestions = found.filter(s => !ignoredSug.has(s.key));
        renderSuggestBar();
        updateUnsure();
        redraw();
      }

      function currentSuggestion() { return suggestions.find(s => s.key === sugKey) || suggestions[0] || null; }
      function renderSuggestBar() {
        const s = currentSuggestion();
        if (!s) { suggestBar.classList.remove('show'); sugKey = null; return; }
        sugKey = s.key;
        const label = s.type === 'merge' ? 'unir' : (s.type === 'split' ? 'separar' : 'corregir');
        sgText.innerHTML = '💡 ' + label + ': <b>' + escHtml(s.from) + '</b> → <b>' + escHtml(s.to) + '</b>';
        sgCount.textContent = (suggestions.indexOf(s) + 1) + '/' + suggestions.length;
        suggestBar.classList.add('show');
      }
      function scrollToGlyph(g) { try { if (g && typeof g.y === 'number') container.scrollTop = Math.max(0, g.y - 80); } catch (e) {} }

      function addLexiconWord(w) {
        if (!dict) return;
        const n = RecoCore.addPersonal(dict, w);
        if (n && !lexicon.includes(n)) { lexicon.push(n); try { localStorage.setItem(LEXICON_KEY, JSON.stringify(lexicon)); } catch (e) {} }
      }

      function acceptSuggestion(s) {
        if (!s) return;
        if (s.type === 'fix') {
          s.gs.forEach((g, k) => {
            const nc = s.to[k];
            if (g.char !== nc) { g.char = nc; addToMemory(nc, g.normPoints); }   // aprende de lo que estaba mal leído
            g.fixed = true; g.conf = 1; g.cands = [{ ch: nc, p: 1 }];
          });
        } else if (s.type === 'merge') {
          const i = glyphs.indexOf(s.spaceG); if (i !== -1) glyphs.splice(i, 1);
        } else if (s.type === 'split') {
          s.after.forEach(g => { const i = glyphs.indexOf(g); if (i !== -1) glyphs.splice(i + 1, 0, { isSpace: true }); });
        }
        sugKey = null;
        rebuildTextFromGlyphs(); relayout();
        setStatus('💡 Sugerencia aplicada', 1500);
      }
      function keepSuggestion(s) {       // "Es correcta": la palabra se guarda en tu vocabulario
        if (!s) return;
        if (s.type === 'merge') ignoredSug.add(s.key); else addLexiconWord(s.from);
        sugKey = null; analyzeNow();
      }
      function skipSuggestion(s) { if (!s) return; ignoredSug.add(s.key); sugKey = null; analyzeNow(); }
      function nextSuggestion() {
        if (!suggestions.length) return;
        const i = suggestions.indexOf(currentSuggestion());
        sugKey = suggestions[(i + 1) % suggestions.length].key;
        renderSuggestBar(); redraw();
        const s = currentSuggestion(); if (s) scrollToGlyph(s.gs[0]);
      }
      document.getElementById('sgAccept').onclick = () => acceptSuggestion(currentSuggestion());
      document.getElementById('sgKeep').onclick = () => keepSuggestion(currentSuggestion());
      document.getElementById('sgSkip').onclick = () => skipSuggestion(currentSuggestion());
      document.getElementById('sgNext').onclick = nextSuggestion;

      // Subrayado celeste debajo de las letras de la sugerencia actual
      function drawSuggestionMarks() {
        const s = currentSuggestion();
        if (!s) return;
        ctx.save();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
        for (const g of s.gs) {
          if (typeof g.x !== 'number') continue;
          ctx.beginPath(); ctx.moveTo(g.x, g.y + g.h + 5); ctx.lineTo(g.x + g.w, g.y + g.h + 5); ctx.stroke();
        }
        ctx.restore();
      }

      // Letras dudosas (naranja): botón con el contador + salto a la siguiente
      function unsureGlyphs() { return glyphs.filter(g => isLetterGlyph(g) && !g.fixed && typeof g.conf === 'number' && g.conf < UNSURE_P); }
      function updateUnsure() {
        const n = unsureGlyphs().length;
        btnUnsure.textContent = '🟠 ' + n;
        btnUnsure.classList.toggle('has', n > 0);
      }
      function nextUnsure() {
        const list = unsureGlyphs();
        if (!list.length) { setStatus('🟠 No hay letras dudosas', 1500); return; }
        const i = selectedGlyph ? list.indexOf(selectedGlyph) : -1;
        const g = list[(i + 1) % list.length];
        selectGlyphForCorrection(g); scrollToGlyph(g);
      }
      btnUnsure.onclick = nextUnsure;
      document.addEventListener('keydown', (e) => {
        if (!e.altKey || e.ctrlKey || e.metaKey) return;
        const k = e.key.toLowerCase();
        if (k === 'a') { e.preventDefault(); acceptSuggestion(currentSuggestion()); }
        else if (k === 'n') { e.preventDefault(); nextSuggestion(); }
        else if (k === 'd') { e.preventDefault(); nextUnsure(); }
      });
      memoryChanged();   // entrena el modelo al abrir la página

      function handleStroke(data) {
        if (!data.id || strokeIds.has(data.id)) return;
        if (data.isCommand) { strokeCount++; addGlyph(data.points || [], data.id, data.isCommand); return; }
        if (!data.points || data.points.length < 2) return;
        strokeCount++;
        addGlyph(data.points, data.id, null);
      }

      function handle(data) {
        if (!data) return;
        if (data.from === CLIENT_ID) return;

        lastMsgAt = Date.now();
        updateLastAct();

        if (data.type === 'hello') {
          setStatus('✏️ Mago activo', 2500);
          // Mago (re)conectó: pido todo de nuevo por si perdimos trazas mientras tanto
          lastSyncSent = 0; requestSync();
          return;
        }
        if (data.type === 'ping') { send({ type: 'pong', ts: Date.now() }); return; }
        if (data.type === 'pong') {
          // presencia ya actualizada arriba; además sincroniza el estado del botón de grabar (salvo que esperemos respuesta a un comando)
          if (typeof data.rec === 'boolean' && !phoneRec.waiting) onRecState({ state: data.rec ? 'recording' : 'idle' });
          return;
        }
        if (data.type === 'rec_state') { onRecState(data); return; }
        if (data.type === 'audio_ack') { return; } // confirmación saliente, nada que hacer
        if (data.type === 'audio_blob') { handleAudio(data); return; }
        if (data.type === 'stroke') { handleStroke(data); return; }
        // Mago reenvía trazas en lotes al resincronizar (dedupe por id lo filtra)
        if (data.type === 'stroke_batch' && Array.isArray(data.strokes)) {
          for (const s of data.strokes) { try { handleStroke(s); } catch (e) {} }
          return;
        }
      }

      try {
        bc = new BroadcastChannel(BC_NAME);
        bc.onmessage = e => { try { handle(e.data); } catch (err) { console.warn('[asistente] mensaje local inválido', err); } };
      } catch (e) { bc = null; }

      // Handshake inicial por cualquier transporte disponible: aunque MQTT tarde
      // o falle, el hello + sync por BroadcastChannel ponen a Mago al día al
      // instante en el mismo equipo. Si no hay nadie escuchando, el hello
      // periódico del ping reintenta hasta que Mago conteste.
      send({ type: 'hello', ts: Date.now() });
      setTimeout(() => { lastSyncSent = 0; requestSync(); }, 800);

      function connectMqtt() {
        if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
          linkState = bc ? 'local' : 'down'; setLink(); return;
        }
        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: 'a_'+CLIENT_ID, clean:true, connectTimeout:3000, reconnectPeriod:4000 });
          mqttClient.on('connect', () => {
            connectedMqtt = true;
            try { mqttClient.subscribe(TOPIC); } catch (e) {}
            linkState = 'mqtt'; setLink();
            send({ type: 'hello', ts: Date.now() });
            lastSyncSent = 0; requestSync();
          });
          mqttClient.on('message', (t, msg) => {
            const run = () => { try { handle(JSON.parse(msg.toString())); } catch (err) { console.warn('[asistente] mensaje MQTT inválido', err); } };
            // En el mismo equipo, BroadcastChannel llega antes: se le da prioridad
            // para evitar duplicados visibles y mantener el orden de llegada.
            if (document.visibilityState === 'visible') setTimeout(run, 120);
            else run();
          });
          mqttClient.on('offline', () => { connectedMqtt = false; linkState = 'reconnect'; setLink(); });
          mqttClient.on('reconnect', () => { connectedMqtt = false; linkState = 'reconnect'; setLink(); });
          mqttClient.on('close', () => { connectedMqtt = false; if (linkState === 'mqtt') { linkState = 'reconnect'; setLink(); } });
          mqttClient.on('error', () => { if (!connectedMqtt) { linkState = 'reconnect'; setLink(); } });
        } catch (e) { linkState = bc ? 'local' : 'down'; setLink(); }
      }
      connectMqtt();

      // Red de seguridad: resincronización suave periódica. Si algún stroke_batch
      // se perdió ( MQTT drop, pestaña en background), se recupera solo.
      // requestSync ya tiene throttle de 3s y Mago dedupea por ID: es seguro.
      setInterval(() => { if (magoAlive) requestSync(); }, 60000);

      // ============ DESHACER ÚLTIMO GLIFO ============
      function undoLast() {
        let li = glyphs.length - 1;
        while (li >= 0 && glyphs[li].isAudioBlock) li--; // el deshacer no toca los bloques de audio
        if (li < 0) return;
        glyphs.splice(li, 1);
        selectedGlyph = null;
        correctBar.classList.remove('show');
        rebuildTextFromGlyphs();
        relayout();
        setStatus('↩ Deshecho', 1200);
      }
      btnUndo.onclick = undoLast;

      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'TEXTAREA' || tag === 'INPUT') return; // respetar deshacer nativo
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoLast(); }
      });

      // Borrar todo a doble toque: evita perder el examen de un toque accidental
      let clearArmed = false, clearArmTimer = null;
      btnClear.onclick = () => {
        if (!clearArmed) {
          clearArmed = true;
          btnClear.textContent = '⚠️';
          setStatus('Tocá 🗑️ otra vez para borrar todo', 2500);
          clearTimeout(clearArmTimer);
          clearArmTimer = setTimeout(() => { clearArmed = false; btnClear.textContent = '🗑️'; }, 2500);
          return;
        }
        clearArmed = false; btnClear.textContent = '🗑️';
        clearTimeout(clearArmTimer);
        clearAll();
        setStatus('🗑️ Borrado', 1500);
      };
      btnCopy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(recognizedText.value);
          setStatus('Copiado ✅', 1500);
        } catch (e) {
          recognizedText.focus(); recognizedText.select();
          setStatus('⚠️ Seleccioná y copiá manualmente', 2500);
        }
      };
    })();
  </script>
</body>
