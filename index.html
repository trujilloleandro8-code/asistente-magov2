<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Asistente Táctico Dual</title>

    <!-- Librería para exportar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Zona táctil gigante para interactuar a ciegas en el bolsillo */
        #touch-zone {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            cursor: pointer;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            color: #888;
        }

        .indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #333;
        }

        .indicator.active {
            background-color: #ff3333;
            box-shadow: 0 0 15px #ff3333;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .center-instruction {
            text-align: center;
            color: #444;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .transcription-display {
            width: 100%;
            max-height: 40vh;
            overflow-y: auto;
            font-size: 1.2rem;
            line-height: 1.5;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
            text-align: center;
            padding: 10px;
            word-break: break-word;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #666;
            font-family: monospace;
        }

        .timer-display.active {
            color: #ff3333;
        }
    </style>
</head>
<body>

    <div id="touch-zone">
        <div class="status-header">
            <div id="indicador" class="indicator"></div>
            <span id="estado-texto">TRIPLE TOQUE PARA GRABAR</span>
        </div>

        <!-- Área donde se muestra el texto reconocido en tiempo real -->
        <div id="transcripcion" class="transcription-display">
            ...
        </div>

        <div class="center-instruction">
            [ Toca 3 veces la pantalla ]
        </div>

        <div id="timer-texto" class="timer-display">
            00s / 59s
        </div>
    </div>

    <script>
        const touchZone = document.getElementById('touch-zone');
        const estadoTexto = document.getElementById('estado-texto');
        const indicador = document.getElementById('indicador');
        const cajaTranscripcion = document.getElementById('transcripcion');
        const timerTexto = document.getElementById('timer-texto');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        let recognition = null;
        let isRecording = false;
        let segundero = 0;
        let timerInterval = null;

        // Detección de triple toque
        let tapCount = 0;
        let tapTimer = null;

        // Feedback táctil por vibración (para uso en bolsillo)
        function vibrar(patron) {
            if ("vibrate" in navigator) {
                navigator.vibrate(patron);
            }
        }

        // Inicializar Reconocimiento de Voz
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let textoAcumulado = '';
                for (let i = 0; i < event.results.length; i++) {
                    textoAcumulado += event.results[i][0].transcript;
                }
                cajaTranscripcion.innerText = textoAcumulado;
            };

            recognition.onerror = (event) => {
                console.error('Error:', event.error);
                if (event.error === 'not-allowed') {
                    vibrar([300, 100, 300]); // Vibración de error
                    detenerGrabacion();
                }
            };

            recognition.onend = () => {
                if (isRecording && segundero < 59) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        } else {
            cajaTranscripcion.innerText = "Reconocimiento de voz no soportado.";
        }

        function iniciarGrabacion() {
            if (isRecording) return;

            isRecording = true;
            segundero = 0;
            
            // Vibración corta doble (avisa al bolsillo que comenzó a grabar)
            vibrar([100, 50, 100]);

            estadoTexto.innerText = "ESCUCHANDO...";
            indicador.classList.add('active');
            timerTexto.classList.add('active');
            cajaTranscripcion.innerText = "Escuchando...";

            try {
                if (recognition) recognition.start();
            } catch (e) {
                console.log(e);
            }

            timerInterval = setInterval(() => {
                segundero++;
                timerTexto.innerText = `${segundero < 10 ? '0' + segundero : segundero}s / 59s`;

                // Límite máximo de 59 segundos
                if (segundero >= 59) {
                    detenerGrabacion();
                }
            }, 1000);
        }

        function detenerGrabacion() {
            if (!isRecording) return;

            isRecording = false;
            clearInterval(timerInterval);

            // Vibración larga (avisa al bolsillo que se detuvo la grabación)
            vibrar(300);

            estadoTexto.innerText = "TRIPLE TOQUE PARA GRABAR";
            indicador.classList.remove('active');
            timerTexto.classList.remove('active');

            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
        }

        function alternarGrabacion() {
            if (!isRecording) {
                iniciarGrabacion();
            } else {
                detenerGrabacion();
            }
        }

        // Lógica para detectar triple toque rápido
        touchZone.addEventListener('click', (e) => {
            tapCount++;

            if (tapCount === 1) {
                tapTimer = setTimeout(() => {
                    tapCount = 0;
                }, 500); // 500ms para completar los 3 toques
            } else if (tapCount === 3) {
                clearTimeout(tapTimer);
                tapCount = 0;
                alternarGrabacion();
            }
        });
    </script>
</body>
</html>
