<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Mago</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 300vh; overflow-x: hidden; overflow-y: auto;
      background: #000; color: #666; font-family: system-ui, sans-serif; user-select: none;
    }
    body::-webkit-scrollbar { display: none; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 300vh; touch-action: none; background: #000; z-index: 1; }
    #ui {
      position: fixed; top: 0; left: 0; right: 0; height: 50px; z-index: 10;
      padding: calc(env(safe-area-inset-top, 8px) + 4px) 12px 4px;
      display: flex; justify-content: space-between; align-items: center;
      opacity: 0.35; transition: opacity 0.3s; background: rgba(0,0,0,0.5); touch-action: pan-y !important;
    }
    #ui:active, #ui:hover { opacity: 0.9; }
    #ui.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .text-btn { background: transparent; color: #555; border: none; font-size: 11px; font-weight: 500; cursor: pointer; padding: 6px 12px; }
    #status { font-size: 9px; color: #22c55e; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button class="text-btn" id="btnStealth">sigilo</button>
    <span id="status">•</span>
  </div>

  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script>
    (function () {
      'use strict';
      const SECRET = 'ninja-mago-asistente-privado-2025-x7k9';
      const TOPIC = `stealthdraw/fixed/${SECRET}`;
      const BC_NAME = `stealth-fixed-${SECRET}`;
      const CLIENT_ID = 'mago_' + Math.random().toString(36).slice(2, 9);

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const ui = document.getElementById('ui');
      const statusEl = document.getElementById('status');
      const btnStealth = document.getElementById('btnStealth');

      let dpr=1, cssW=0, cssH=0, drawing=false, currentPoints=[], stealthMode=false;
      let mqttClient=null, bc=null, connectedMqtt=false;
      let longPressTimer = null, hasMoved = false, startPos = null;
      let tapTimestamps = [];
      let activePointers = new Set();
      let pauseTimer = null;
      
      // ============ GRABACIÓN DE AUDIO CON CORTE POR SILENCIO (VAD) ============
      // Ajustes (tocá estos valores si corta muy pronto o tarde)
      const MAX_RECORD_MS   = 60000; // duración máxima por audio
      const GRACE_MS        = 4500;  // margen inicial: no se evalúa silencio antes de esto
      const SILENCE_CUT_MS  = 3500;  // silencio continuo que dispara el corte automático
      const MIN_THRESHOLD   = 0.003; // umbral mínimo de volumen (RMS 0..1). Un susurro crudo ronda 0.003-0.006
      const MAX_THRESHOLD   = 0.020; // umbral máximo (para no confundir susurros con silencio)
      const NOISE_FACTOR    = 2.5;   // umbral = ruido de fondo x este factor
      const AUDIO_BITRATE   = 24000; // bits/s: mantiene el audio chico para MQTT (60s ≈ 180 KB)
      const VAD_TICK_MS     = 80;
      // Filtros del micrófono. false = micrófono "crudo": el supresor de ruido del navegador trata un susurro
      // constante como ruido de fondo y lo va apagando hasta dejarlo mudo. Ponelo en true solo si querés probar.
      const MIC_FILTERS     = false;
      // Pausa (sin dibujar) que inserta un espacio solo. Antes 700 ms: con trazos lentos se ponían espacios de más.
      // Para un espacio a propósito sigue valiendo 1 toque. Subilo si aún sobran espacios, bajalo si faltan.
      const AUTO_SPACE_MS   = 1100;
      const KEEP_SCREEN_ON  = true;  // mantiene la pantalla (negra) encendida: con la pantalla bloqueada el celular no recibe comandos

      let screenLock = null;
      function keepScreenOn() {
        if (!KEEP_SCREEN_ON) return;
        try {
          if (navigator.wakeLock && document.visibilityState === 'visible') {
            navigator.wakeLock.request('screen').then(l => { screenLock = l; }).catch(() => {});
          }
        } catch (e) {}
      }
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepScreenOn(); });
      keepScreenOn();
      const VOICE_CONFIRM_MS = 240;  // tiempo de voz ACUMULADO (no seguido) para dar por hecho que hablaste
      const VOICE_IGNORE_MS  = 600;  // ignora el arranque: toques en pantalla y vibración suenan en el micrófono
      const NO_VOICE_CUT_MS  = 12000; // si en este tiempo no se detectó voz, corta igual

      let audioStream = null;
      let audioCtx = null, analyser = null, vadBuf = null, vadSrc = null;
      let noiseFloor = 0.004, levelSmooth = 0;
      let current = null; // grabación en curso

      // ============ BUFFER DE REENVÍO (por si el asistente se reconecta o pierde mensajes) ============
      const STROKE_BUF_MAX = 400;
      const AUDIO_BUF_MAX = 4;
      const strokeBuffer = [];      // últimas trazas/comandos enviados
      const audioBuffer = new Map(); // id -> payload de audio sin confirmar (audio_ack)

      function bufferStroke(payload) {
        strokeBuffer.push(payload);
        if (strokeBuffer.length > STROKE_BUF_MAX) strokeBuffer.shift();
      }

      async function initAudioRecorder() {
        if (audioStream) return;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
          audioStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: MIC_FILTERS,
              noiseSuppression: MIC_FILTERS,
              autoGainControl: false,
              voiceIsolation: false
            }
          });
        } catch (err) {}
      }
      initAudioRecorder();

      function setupAnalyser() {
        if (analyser || !audioStream) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
          vadSrc = audioCtx.createMediaStreamSource(audioStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0;
          vadSrc.connect(analyser); // no se conecta a destination: sin eco ni sonido
          vadBuf = new Float32Array(analyser.fftSize);
        } catch (e) { analyser = null; vadSrc = null; }
      }

      // Libera AudioContext, AnalyserNode y MediaStream al terminar la grabación (evita fugas)
      function teardownAudioResources() {
        if (current) return; // una nueva grabación ya arrancó: no tocar sus recursos
        try { if (vadSrc) vadSrc.disconnect(); } catch (e) {}
        vadSrc = null; analyser = null; vadBuf = null;
        if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
        if (audioStream) {
          audioStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          audioStream = null;
        }
      }

      function readLevel() {
        analyser.getFloatTimeDomainData(vadBuf);
        let sum = 0;
        for (let i = 0; i < vadBuf.length; i++) sum += vadBuf[i] * vadBuf[i];
        const rms = Math.sqrt(sum / vadBuf.length);
        levelSmooth = levelSmooth * 0.6 + rms * 0.4;
        return levelSmooth;
      }

       function vadTick(s) {
         if (s.done) return;
         if (!analyser || !audioCtx) {
           finishRecording(s, false);
           return;
         }
         try {
           const now = performance.now();
           const elapsed = now - s.startedAt;
           const dt = s._lastTick ? Math.min(now - s._lastTick, 250) : VAD_TICK_MS;
           s._lastTick = now;
           const lvl = readLevel();

           // Ruido de fondo: baja rápido, sube muy lento (y con tope)
           if (lvl < noiseFloor) noiseFloor = noiseFloor * 0.5 + lvl * 0.5;
           else noiseFloor += (lvl - noiseFloor) * 0.0005;
           noiseFloor = Math.min(noiseFloor, 0.012);

           const threshold = Math.min(MAX_THRESHOLD, Math.max(MIN_THRESHOLD, noiseFloor * NOISE_FACTOR + 0.001));
           s.lastThreshold = threshold;
           if (lvl > s.peakLevel) s.peakLevel = lvl;

           // Gráfico: promedio del nivel de cada ventana de 500 ms
           s._winSum += lvl; s._winN++;
           if (now - s._lastLevelTs >= 500) {
             s.levels.push(s._winSum / Math.max(1, s._winN));
             if (s.levels.length > 120) s.levels.shift();
             s._winSum = 0; s._winN = 0; s._lastLevelTs = now;
           }

           const voiced = lvl >= threshold;

           // Voz ACUMULADA: corre en cada tick (también durante el margen inicial) y nunca se reinicia,
           // así un susurro que sube y baja igual cuenta. Se ignora el arranque (toques/vibración).
           if (voiced && elapsed >= VOICE_IGNORE_MS) {
             s.voiceMs += dt;
             if (s.voiceMs >= VOICE_CONFIRM_MS) s.hadVoice = true;
           }

           // Grabación comandada desde el asistente: solo se corta con "detener" o al llegar al máximo
           if (s.manual) return;

           // Margen inicial: todavía no se evalúa ningún corte
           if (elapsed < GRACE_MS) { s.silenceSince = null; return; }

           // Si nunca se detectó voz, espera hasta NO_VOICE_CUT_MS y corta
           if (!s.hadVoice) {
             if (elapsed >= NO_VOICE_CUT_MS) { s.stopReason = 'silence'; finishRecording(s, false); }
             return;
           }

           // Ya hubo voz: corta tras SILENCE_CUT_MS de silencio continuo
           if (voiced) {
             s.silenceSince = null;
           } else if (s.silenceSince === null) {
             s.silenceSince = now;
           } else if (now - s.silenceSince >= SILENCE_CUT_MS) {
             s.stopReason = 'silence';
             finishRecording(s, false);
           }
         } catch (e) {
           finishRecording(s, false);
         }
       }

       function finishRecording(session, restarting) {
         if (!session || session.done) return;
         session.done = true;
         session.restarting = !!restarting;
         session.endedAt = performance.now();
         clearInterval(session.vad);
         clearTimeout(session.timer);
         if (current === session) current = null;
         try { if (session.rec && session.rec.state !== 'inactive') session.rec.stop(); } catch (e) {}
         notifyRec('idle', { reason: session.stopReason || 'other' });
         // Limpieza diferida: deja que MediaRecorder entregue su chunk final antes de cerrar todo
         setTimeout(teardownAudioResources, 0);
         // Seguridad: fuerza limpieza si onstop nunca llega
         setTimeout(teardownAudioResources, 2000);
       }

      async function startNewRecording(opts) {
        if (!audioStream) await initAudioRecorder();
        if (!audioStream) return;
        setupAnalyser();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

        let rec;
        try { rec = new MediaRecorder(audioStream, { audioBitsPerSecond: AUDIO_BITRATE }); }
        catch (e) { try { rec = new MediaRecorder(audioStream); } catch (e2) { return; } }

        const chunks = [];
        const session = { rec, startedAt: performance.now(), silenceSince: null, vad: null, timer: null, done: false, restarting: false, stopReason: null, peakLevel: 0, lastThreshold: 0, levels: [], hadVoice: false, voiceMs: 0, _lastTick: 0, _winSum: 0, _winN: 0, _lastLevelTs: performance.now(), endedAt: 0, manual: !!(opts && opts.manual) };
        levelSmooth = 0;

        rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        rec.onstop = () => {
          clearInterval(session.vad); clearTimeout(session.timer);
         try {
           const audioBlob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
           if (audioBlob.size < 1500) { teardownAudioResources(); return; } // grabación vacía o demasiado corta
           const reader = new FileReader();
            reader.onloadend = () => {
              try {
                const payload = {
                  type: 'audio_blob',
                  id: 'audio_' + Date.now(),
                  from: CLIENT_ID,
                  audioBase64: reader.result,
                  ts: Date.now(),
                  durationMs: Math.round((session.endedAt || performance.now()) - session.startedAt),
                  stopReason: session.stopReason || 'other'
                };
                if (session.peakLevel > 0) payload.peakLevel = Math.round(session.peakLevel * 10000) / 10000;
                if (session.lastThreshold > 0) payload.threshold = Math.round(session.lastThreshold * 10000) / 10000;
                if (Array.isArray(session.levels) && session.levels.length > 0) {
                  payload.levels = session.levels.map(v => Math.round(v * 10000) / 10000);
                }
                // Queda en el buffer por si el asistente no lo recibe a la primera
                audioBuffer.set(payload.id, payload);
                while (audioBuffer.size > AUDIO_BUF_MAX) {
                  audioBuffer.delete(audioBuffer.keys().next().value);
                }
                send(payload);
               // Vibración corta al enviar (si se reinicia, ya vibra el inicio de la nueva)
               if (!session.restarting && navigator.vibrate) navigator.vibrate(100);
              } finally {
                teardownAudioResources();
              }
            };
            reader.onerror = () => teardownAudioResources();
            reader.readAsDataURL(audioBlob);
          } catch (ex) { teardownAudioResources(); }
        };

         try { rec.start(); } catch (e) { teardownAudioResources(); return; }
         current = session;
         if (navigator.vibrate) navigator.vibrate([70, 40, 70]);
         notifyRec('recording', { manual: session.manual });

         session.timer = setTimeout(() => { session.stopReason = 'max'; finishRecording(session, false); }, MAX_RECORD_MS);
         if (analyser) session.vad = setInterval(() => vadTick(session), VAD_TICK_MS);
      }

      // Triple toque: si graba, corta y envía el actual y arranca uno nuevo desde cero
      function triggerAudioCapture() {
        if (!audioStream) {
          initAudioRecorder().then(() => { if (audioStream) startNewRecording(); });
          return;
        }
        if (current) {
          if (!current.stopReason) current.stopReason = 'triple';
          finishRecording(current, true);
          setTimeout(startNewRecording, 250);
          return;
        }
        startNewRecording();
      }

      function resize() {
        dpr = Math.min(devicePixelRatio||1, 2.5);
        cssW = innerWidth; cssH = innerHeight * 3;
        canvas.width = Math.floor(cssW*dpr); canvas.height = Math.floor(cssH*dpr);
        canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        redraw();
      }
      addEventListener('resize', resize);
      resize();

      function clearCanvas() { ctx.fillStyle = '#000'; ctx.fillRect(0,0,cssW,cssH); }
      function drawStroke(pts, color, w) {
        if (!pts || pts.length < 2) return;
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(pts[0].x*cssW, pts[0].y*cssH);
        for (let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x*cssW, pts[i].y*cssH);
        ctx.stroke(); ctx.restore();
      }
      function redraw() {
        clearCanvas();
        if (currentPoints.length > 1) {
          const col = stealthMode ? 'rgba(15,15,15,0.3)' : 'rgba(200,200,200,0.85)';
          drawStroke(currentPoints, col, stealthMode ? 2.5 : 3.8);
        }
      }

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)),
          y: Math.max(0, Math.min(1, (e.clientY-r.top)/r.height))
        };
      }

      function send(payload) {
        try { if (bc) bc.postMessage(payload); } catch{}
        try { if (mqttClient && connectedMqtt) mqttClient.publish(TOPIC, JSON.stringify(payload), {qos: payload.type === 'audio_blob' ? 1 : 0}); } catch(e) {}
      }

      // Igual que send pero además deja la traza en el buffer de reenvío
      function sendStroke(payload) {
        bufferStroke(payload);
        send(payload);
      }

      // ============ MENSAJES DEL ASISTENTE (presencia + resincronización) ============
      // ============ GRABAR / DETENER DESDE EL ASISTENTE ============
      const recCmdSeen = new Set();
      let startingRec = false;
      function notifyRec(state, extra) {
        send(Object.assign({ type: 'rec_state', from: CLIENT_ID, state: state, ts: Date.now() }, extra || {}));
      }
      function remoteStartRecording() {
        if (current) { notifyRec('recording', { manual: !!current.manual, already: true }); return; }
        if (startingRec) return;
        startingRec = true;
        startNewRecording({ manual: true })
          .then(() => { startingRec = false; if (!current) notifyRec('idle', { reason: 'no-mic' }); })
          .catch(() => { startingRec = false; notifyRec('idle', { reason: 'error' }); });
      }
      function remoteStopRecording() {
        if (!current) { notifyRec('idle', { reason: 'not-recording' }); return; }
        current.stopReason = 'remote';
        finishRecording(current, false);
      }

      function handleAsistenteMsg(data) {
        if (!data || data.from === CLIENT_ID) return;
        if (data.type === 'ping') { send({ type: 'pong', from: CLIENT_ID, ts: Date.now(), rec: !!current }); return; }
        if (data.type === 'rec_cmd') {
          // Se manda por BroadcastChannel y por MQTT: el id evita ejecutarlo dos veces
          if (data.id) {
            if (recCmdSeen.has(data.id)) return;
            recCmdSeen.add(data.id);
            if (recCmdSeen.size > 60) recCmdSeen.delete(recCmdSeen.values().next().value);
          }
          if (data.action === 'start') remoteStartRecording();
          else if (data.action === 'stop') remoteStopRecording();
          return;
        }
        if (data.type === 'hello') { send({ type: 'hello', from: CLIENT_ID, ts: Date.now() }); resyncTo(data.from); return; }
        if (data.type === 'sync_request') { resyncTo(data.from, data.haveAudio); return; }
        if (data.type === 'audio_ack') {
          if (data.ackId) audioBuffer.delete(data.ackId); // el asistente lo recibió: no hace falta reenviarlo
          return;
        }
      }

      // Reenvía trazas por lotes y los audios que el asistente no tenía.
      // El asistente descarta ids repetidos, así que es seguro reenviar de más.
      let lastResync = 0;
      function resyncTo(_target, haveAudio) {
        const now = Date.now();
        if (now - lastResync < 2000) return; // evita tormentas si llegan hellos duplicados
        lastResync = now;
        for (let i = 0; i < strokeBuffer.length; i += 25) {
          send({ type: 'stroke_batch', from: CLIENT_ID, strokes: strokeBuffer.slice(i, i + 25), ts: Date.now() });
        }
        const have = new Set(Array.isArray(haveAudio) ? haveAudio : []);
        for (const [id, payload] of audioBuffer) {
          if (!have.has(id)) send(Object.assign({}, payload));
        }
        if (navigator.vibrate) navigator.vibrate(30);
      }

      function start(e) {
        if (e.target === ui || ui.contains(e.target)) return;
        if (e.button !== undefined && e.button !== 0) return;
        if (pauseTimer) clearTimeout(pauseTimer);
        activePointers.add(e.pointerId);

        if (activePointers.size >= 2) { drawing = false; currentPoints = []; redraw(); clearTimeout(longPressTimer); return; }

        drawing = true; hasMoved = false; startPos = getPos(e); currentPoints = [startPos];
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          if (drawing && !hasMoved && activePointers.size === 1) {
            drawing = false; currentPoints = []; redraw();
            sendStroke({ type: 'stroke', id: 'cmd_option_' + Date.now(), from: CLIENT_ID, isCommand: 'option', points: [] });
            if (navigator.vibrate) navigator.vibrate(70);
          }
        }, 750);
      }

      function move(e) {
        if (activePointers.size >= 2 || !drawing) return;
        const p = getPos(e);
        if (startPos && Math.hypot(p.x - startPos.x, p.y - startPos.y) > 0.015) {
          if (!hasMoved) { hasMoved = true; clearTimeout(longPressTimer); }
        }
        const last = currentPoints[currentPoints.length-1];
        if ((p.x-last.x)**2 + (p.y-last.y)**2 > 0.00003) { currentPoints.push(p); redraw(); }
      }

      function end(e) {
        clearTimeout(longPressTimer);
        activePointers.delete(e.pointerId);

        if (!drawing) return; 
        drawing = false;

        if (!hasMoved && activePointers.size === 0) {
          const now = Date.now();
          tapTimestamps.push(now);
          tapTimestamps = tapTimestamps.filter(t => now - t < 500);

          if (tapTimestamps.length === 3) {
            tapTimestamps = [];
            sendStroke({ type: 'stroke', id: 'cmd_question_' + Date.now(), from: CLIENT_ID, isCommand: 'question', points: [] });
            triggerAudioCapture(); // Clic/Reinicio de audio
          } else if (tapTimestamps.length === 2) {
            sendStroke({ type: 'stroke', id: 'cmd_newline_' + Date.now(), from: CLIENT_ID, isCommand: 'newline', points: [] });
            if (navigator.vibrate) navigator.vibrate(45);
          } else if (tapTimestamps.length === 1) {
            setTimeout(() => {
              if (tapTimestamps.length === 1) {
                tapTimestamps = [];
                sendStroke({ type: 'stroke', id: 'cmd_space_' + Date.now(), from: CLIENT_ID, isCommand: 'space', points: [] });
                if (navigator.vibrate) navigator.vibrate(20);
              }
            }, 200);
          }
        }

        if (hasMoved && currentPoints.length >= 2 && activePointers.size === 0) {
          sendStroke({
            type: 'stroke',
            id: CLIENT_ID + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
            from: CLIENT_ID, points: currentPoints, ts: Date.now()
          });

          if (pauseTimer) clearTimeout(pauseTimer);
          pauseTimer = setTimeout(() => {
            sendStroke({ type: 'stroke', id: 'cmd_space_' + Date.now(), from: CLIENT_ID, isCommand: 'space', points: [] });
          }, AUTO_SPACE_MS);
        }
        currentPoints = []; redraw();
      }

      canvas.addEventListener('pointerdown', start);
      canvas.addEventListener('pointermove', move);
      canvas.addEventListener('pointerup', end);

      btnStealth.onclick = () => {
        stealthMode = !stealthMode;
        if (stealthMode) { ui.classList.add('hidden'); }
        else { ui.classList.remove('hidden'); }
        redraw();
      };

      try {
        bc = new BroadcastChannel(BC_NAME);
        bc.onmessage = e => { try { handleAsistenteMsg(e.data); } catch (err) {} };
      } catch{}

      function connect() {
        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'm_'+CLIENT_ID, clean:true, connectTimeout:8000, reconnectPeriod:4000
          });
          mqttClient.on('connect', () => {
            connectedMqtt=true; mqttClient.subscribe(TOPIC); statusEl.textContent = '•';
            send({ type: 'hello', from: CLIENT_ID, ts: Date.now() });
          });
          mqttClient.on('message', (t, msg) => {
            // En el mismo equipo BroadcastChannel ya lo trajo: priorizarlo evita duplicados
            const run = () => { try { handleAsistenteMsg(JSON.parse(msg.toString())); } catch (err) {} };
            if (document.visibilityState === 'visible') setTimeout(run, 120);
            else run();
          });
          mqttClient.on('error', () => { connectedMqtt=false; statusEl.textContent = '…'; });
        } catch(e) {}
      }
      connect();
    })();
  </script>
</body>
</html>
