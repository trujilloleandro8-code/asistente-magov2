<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Mago</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 300vh; overflow-x: hidden; overflow-y: auto;
      background: #000; color: #666; font-family: system-ui, sans-serif; user-select: none;
    }
    body::-webkit-scrollbar { display: none; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 300vh; touch-action: none; background: #000; z-index: 1; }
    #ui {
      position: fixed; top: 0; left: 0; right: 0; height: 50px; z-index: 10;
      padding: calc(env(safe-area-inset-top, 8px) + 4px) 12px 4px;
      display: flex; justify-content: space-between; align-items: center;
      opacity: 0.35; transition: opacity 0.3s; background: rgba(0,0,0,0.5); touch-action: pan-y !important;
    }
    #ui:active, #ui:hover { opacity: 0.9; }
    #ui.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .text-btn { background: transparent; color: #555; border: none; font-size: 11px; font-weight: 500; cursor: pointer; padding: 6px 12px; }
    #status { font-size: 9px; color: #22c55e; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button class="text-btn" id="btnStealth">sigilo</button>
    <span id="status">•</span>
  </div>

  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script>
    (function () {
      'use strict';
      const SECRET = 'ninja-mago-asistente-privado-2025-x7k9';
      const TOPIC = `stealthdraw/fixed/${SECRET}`;
      const BC_NAME = `stealth-fixed-${SECRET}`;
      const CLIENT_ID = 'mago_' + Math.random().toString(36).slice(2, 9);

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const ui = document.getElementById('ui');
      const statusEl = document.getElementById('status');
      const btnStealth = document.getElementById('btnStealth');

      let dpr=1, cssW=0, cssH=0, drawing=false, currentPoints=[], stealthMode=false;
      let mqttClient=null, bc=null, connectedMqtt=false;
      let longPressTimer = null, hasMoved = false, startPos = null;
      let tapTimestamps = [];
      let activePointers = new Set();
      let pauseTimer = null;
      
      // ============ GRABACIÓN DE AUDIO CON CORTE POR SILENCIO (VAD) ============
      // Ajustes (tocá estos valores si corta muy pronto o tarde)
      const MAX_RECORD_MS   = 60000; // duración máxima por audio
      const GRACE_MS        = 4500;  // margen inicial: no se evalúa silencio antes de esto
      const SILENCE_CUT_MS  = 2300;  // silencio continuo que dispara el corte automático
      const MIN_THRESHOLD   = 0.008; // umbral mínimo de volumen (RMS 0..1)
      const MAX_THRESHOLD   = 0.030; // umbral máximo (para no confundir susurros con silencio)
      const NOISE_FACTOR    = 2.5;   // umbral = ruido de fondo x este factor
      const AUDIO_BITRATE   = 24000; // bits/s: mantiene el audio chico para MQTT (60s ≈ 180 KB)
      const VAD_TICK_MS     = 80;

      let audioStream = null;
      let audioCtx = null, analyser = null, vadBuf = null;
      let noiseFloor = 0.004, levelSmooth = 0;
      let current = null; // grabación en curso

      async function initAudioRecorder() {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
          audioStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }
          });
        } catch (err) {}
      }
      initAudioRecorder();

      function setupAnalyser() {
        if (analyser || !audioStream) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
          const src = audioCtx.createMediaStreamSource(audioStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0;
          src.connect(analyser); // no se conecta a destination: sin eco ni sonido
          vadBuf = new Float32Array(analyser.fftSize);
        } catch (e) { analyser = null; }
      }

      function readLevel() {
        analyser.getFloatTimeDomainData(vadBuf);
        let sum = 0;
        for (let i = 0; i < vadBuf.length; i++) sum += vadBuf[i] * vadBuf[i];
        const rms = Math.sqrt(sum / vadBuf.length);
        levelSmooth = levelSmooth * 0.6 + rms * 0.4;
        return levelSmooth;
      }

      function vadTick(s) {
        if (s.done || !analyser) return;
        const now = performance.now();
        const elapsed = now - s.startedAt;
        const lvl = readLevel();

        // Ruido de fondo: baja rápido, sube muy lento (y con tope)
        if (lvl < noiseFloor) noiseFloor = noiseFloor * 0.5 + lvl * 0.5;
        else noiseFloor += (lvl - noiseFloor) * 0.0005;
        noiseFloor = Math.min(noiseFloor, 0.012);

        const threshold = Math.min(MAX_THRESHOLD, Math.max(MIN_THRESHOLD, noiseFloor * NOISE_FACTOR + 0.003));

        if (elapsed < GRACE_MS) { s.silenceSince = null; return; }

        if (lvl < threshold) {
          if (s.silenceSince === null) s.silenceSince = now;
          else if (now - s.silenceSince >= SILENCE_CUT_MS) finishRecording(s, false);
        } else {
          s.silenceSince = null;
        }
      }

      function finishRecording(session, restarting) {
        if (!session || session.done) return;
        session.done = true;
        session.restarting = !!restarting;
        clearInterval(session.vad);
        clearTimeout(session.timer);
        if (current === session) current = null;
        try { if (session.rec.state !== 'inactive') session.rec.stop(); } catch (e) {}
      }

      function startNewRecording() {
        if (!audioStream) { initAudioRecorder(); return; }
        setupAnalyser();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

        let rec;
        try { rec = new MediaRecorder(audioStream, { audioBitsPerSecond: AUDIO_BITRATE }); }
        catch (e) { try { rec = new MediaRecorder(audioStream); } catch (e2) { return; } }

        const chunks = [];
        const session = { rec, startedAt: performance.now(), silenceSince: null, vad: null, timer: null, done: false, restarting: false };
        levelSmooth = 0;

        rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        rec.onstop = () => {
          clearInterval(session.vad); clearTimeout(session.timer);
          try {
            const audioBlob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
            if (audioBlob.size < 1500) return; // grabación vacía o demasiado corta
            const reader = new FileReader();
            reader.onloadend = () => {
              send({
                type: 'audio_blob',
                id: 'audio_' + Date.now(),
                from: CLIENT_ID,
                audioBase64: reader.result,
                ts: Date.now()
              });
              // Vibración corta al enviar (si se reinicia, ya vibra el inicio de la nueva)
              if (!session.restarting && navigator.vibrate) navigator.vibrate(100);
            };
            reader.readAsDataURL(audioBlob);
          } catch (ex) {}
        };

        try { rec.start(); } catch (e) { return; }
        current = session;
        if (navigator.vibrate) navigator.vibrate([70, 40, 70]);

        session.timer = setTimeout(() => finishRecording(session, false), MAX_RECORD_MS);
        if (analyser) session.vad = setInterval(() => vadTick(session), VAD_TICK_MS);
      }

      // Triple toque: si graba, corta y envía el actual y arranca uno nuevo desde cero
      function triggerAudioCapture() {
        if (!audioStream) { initAudioRecorder(); return; }
        if (current) {
          finishRecording(current, true);
          setTimeout(startNewRecording, 250);
          return;
        }
        startNewRecording();
      }

      function resize() {
        dpr = Math.min(devicePixelRatio||1, 2.5);
        cssW = innerWidth; cssH = innerHeight * 3;
        canvas.width = Math.floor(cssW*dpr); canvas.height = Math.floor(cssH*dpr);
        canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        redraw();
      }
      addEventListener('resize', resize);
      resize();

      function clearCanvas() { ctx.fillStyle = '#000'; ctx.fillRect(0,0,cssW,cssH); }
      function drawStroke(pts, color, w) {
        if (!pts || pts.length < 2) return;
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(pts[0].x*cssW, pts[0].y*cssH);
        for (let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x*cssW, pts[i].y*cssH);
        ctx.stroke(); ctx.restore();
      }
      function redraw() {
        clearCanvas();
        if (currentPoints.length > 1) {
          const col = stealthMode ? 'rgba(15,15,15,0.3)' : 'rgba(200,200,200,0.85)';
          drawStroke(currentPoints, col, stealthMode ? 2.5 : 3.8);
        }
      }

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)),
          y: Math.max(0, Math.min(1, (e.clientY-r.top)/r.height))
        };
      }

      function send(payload) {
        try { if (bc) bc.postMessage(payload); } catch{}
        try { if (mqttClient && connectedMqtt) mqttClient.publish(TOPIC, JSON.stringify(payload), {qos:0}); } catch(e) {}
      }

      function start(e) {
        if (e.target === ui || ui.contains(e.target)) return;
        if (e.button !== undefined && e.button !== 0) return;
        if (pauseTimer) clearTimeout(pauseTimer);
        activePointers.add(e.pointerId);

        if (activePointers.size >= 2) { drawing = false; currentPoints = []; redraw(); clearTimeout(longPressTimer); return; }

        drawing = true; hasMoved = false; startPos = getPos(e); currentPoints = [startPos];
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          if (drawing && !hasMoved && activePointers.size === 1) {
            drawing = false; currentPoints = []; redraw();
            send({ type: 'stroke', id: 'cmd_option_' + Date.now(), from: CLIENT_ID, isCommand: 'option', points: [] });
            if (navigator.vibrate) navigator.vibrate(70);
          }
        }, 750);
      }

      function move(e) {
        if (activePointers.size >= 2 || !drawing) return;
        const p = getPos(e);
        if (startPos && Math.hypot(p.x - startPos.x, p.y - startPos.y) > 0.015) {
          if (!hasMoved) { hasMoved = true; clearTimeout(longPressTimer); }
        }
        const last = currentPoints[currentPoints.length-1];
        if ((p.x-last.x)**2 + (p.y-last.y)**2 > 0.00003) { currentPoints.push(p); redraw(); }
      }

      function end(e) {
        clearTimeout(longPressTimer);
        activePointers.delete(e.pointerId);

        if (!drawing) return; 
        drawing = false;

        if (!hasMoved && activePointers.size === 0) {
          const now = Date.now();
          tapTimestamps.push(now);
          tapTimestamps = tapTimestamps.filter(t => now - t < 500);

          if (tapTimestamps.length === 3) {
            tapTimestamps = [];
            send({ type: 'stroke', id: 'cmd_question_' + Date.now(), from: CLIENT_ID, isCommand: 'question', points: [] });
            triggerAudioCapture(); // Clic/Reinicio de audio
          } else if (tapTimestamps.length === 2) {
            send({ type: 'stroke', id: 'cmd_newline_' + Date.now(), from: CLIENT_ID, isCommand: 'newline', points: [] });
            if (navigator.vibrate) navigator.vibrate(45);
          } else if (tapTimestamps.length === 1) {
            setTimeout(() => {
              if (tapTimestamps.length === 1) {
                tapTimestamps = [];
                send({ type: 'stroke', id: 'cmd_space_' + Date.now(), from: CLIENT_ID, isCommand: 'space', points: [] });
                if (navigator.vibrate) navigator.vibrate(20);
              }
            }, 200);
          }
        }

        if (hasMoved && currentPoints.length >= 2 && activePointers.size === 0) {
          send({
            type: 'stroke',
            id: CLIENT_ID + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
            from: CLIENT_ID, points: currentPoints, ts: Date.now()
          });

          if (pauseTimer) clearTimeout(pauseTimer);
          pauseTimer = setTimeout(() => {
            send({ type: 'stroke', id: 'cmd_space_' + Date.now(), from: CLIENT_ID, isCommand: 'space', points: [] });
          }, 700);
        }
        currentPoints = []; redraw();
      }

      canvas.addEventListener('pointerdown', start);
      canvas.addEventListener('pointermove', move);
      canvas.addEventListener('pointerup', end);

      btnStealth.onclick = () => {
        stealthMode = !stealthMode;
        if (stealthMode) { ui.classList.add('hidden'); }
        else { ui.classList.remove('hidden'); }
        redraw();
      };

      try { bc = new BroadcastChannel(BC_NAME); } catch{}

      function connect() {
        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'm_'+CLIENT_ID, clean:true, connectTimeout:8000, reconnectPeriod:4000
          });
          mqttClient.on('connect', () => { connectedMqtt=true; mqttClient.subscribe(TOPIC); statusEl.textContent = '•'; });
          mqttClient.on('error', () => { connectedMqtt=false; statusEl.textContent = '…'; });
        } catch(e) {}
      }
      connect();
    })();
  </script>
</body>
</html>
