<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Mago</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 300vh; overflow-x: hidden; overflow-y: auto;
      background: #000; color: #666; font-family: system-ui, sans-serif; user-select: none;
    }
    body::-webkit-scrollbar { display: none; }
    #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 300vh; touch-action: none; background: #000; z-index: 1; }
    #ui {
      position: fixed; top: 0; left: 0; right: 0; height: 50px; z-index: 10;
      padding: calc(env(safe-area-inset-top, 8px) + 4px) 12px 4px;
      display: flex; justify-content: space-between; align-items: center;
      opacity: 0.35; transition: opacity 0.3s; background: rgba(0,0,0,0.5); touch-action: pan-y !important;
    }
    #ui:active, #ui:hover { opacity: 0.9; }
    #ui.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .text-btn { background: transparent; color: #555; border: none; font-size: 11px; font-weight: 500; cursor: pointer; padding: 6px 12px; }
    #status { font-size: 9px; color: #22c55e; }
    #errorLog {
      position: fixed; bottom: 40px; left: 10px; right: 10px; z-index: 20;
      background: rgba(127, 29, 29, 0.9); color: #fff; font-size: 10px; padding: 6px;
      border-radius: 4px; display: none; pointer-events: none; max-height: 80px; overflow: hidden;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <button class="text-btn" id="btnStealth">sigilo</button>
    <span id="status">•</span>
  </div>
  <div id="errorLog"></div>

  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script>
    (function () {
      'use strict';
      const SECRET = 'ninja-mago-asistente-privado-2025-x7k9';
      const TOPIC = `stealthdraw/fixed/${SECRET}`;
      const BC_NAME = `stealth-fixed-${SECRET}`;
      const CLIENT_ID = 'mago_' + Math.random().toString(36).slice(2, 9);

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const ui = document.getElementById('ui');
      const statusEl = document.getElementById('status');
      const btnStealth = document.getElementById('btnStealth');
      const errorLog = document.getElementById('errorLog');

      function showError(msg) {
        errorLog.style.display = 'block';
        errorLog.textContent = 'ERROR: ' + msg;
        setTimeout(() => { errorLog.style.display = 'none'; }, 6000);
      }

      let dpr=1, cssW=0, cssH=0, drawing=false, currentPoints=[], stealthMode=false;
      let mqttClient=null, bc=null, connectedMqtt=false;
      let longPressTimer = null, hasMoved = false, startPos = null;
      let tapTimestamps = [];
      let activePointers = new Set();
      let twoFingerTapTimestamps = [];
      let pauseTimer = null;
      
      let mediaRecorder = null;
      let audioChunks = [];
      let audioStream = null;
      let audioContext = null;
      let analyser = null;
      let silenceCheckInterval = null;

      let debugBox = document.createElement('div');
      debugBox.style.cssText = "position:fixed; top:60px; left:10px; right:10px; z-index:99; background:rgba(0,0,0,0.85); color:#facc15; font-size:12px; padding:8px; border-radius:5px; pointer-events:none; display:none;";
      document.body.appendChild(debugBox);

      async function initAudioRecorder() {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
          audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(audioStream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            try {
              const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
              audioChunks = [];
              const reader = new FileReader();
              reader.onloadend = () => {
                send({
                  type: 'audio_blob',
                  id: 'audio_' + Date.now(),
                  from: CLIENT_ID,
                  audioBase64: reader.result,
                  ts: Date.now()
                });
              };
              reader.readAsDataURL(audioBlob);
            } catch(ex) {
              showError("Error procesando audio: " + ex.message);
            }
          };
        } catch(err) {
          showError("Permiso de micrófono denegado: " + err.message);
        }
      }
      initAudioRecorder();

      function triggerAudioCapture() {
        if (!mediaRecorder) {
          initAudioRecorder();
          showError("MediaRecorder no listo.");
          return;
        }
        try {
          audioChunks = [];
          if (mediaRecorder.state === 'recording') mediaRecorder.stop();
          mediaRecorder.start();
          if (navigator.vibrate) navigator.vibrate([70, 40, 70]);

          if (!audioContext && audioStream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaStreamSource(audioStream);
            source.connect(analyser);
            analyser.fftSize = 256;
          }

          const startTime = Date.now();
          const MIN_DURATION = 20000; // 20 segundos mínimo
          const MAX_DURATION = 60000; // 60 segundos máximo
          let silentFrames = 0;

          if (silenceCheckInterval) clearInterval(silenceCheckInterval);
          debugBox.style.display = 'block';

          silenceCheckInterval = setInterval(() => {
            const elapsed = Date.now() - startTime;
            const remainingSec = Math.max(0, Math.ceil((MIN_DURATION - elapsed) / 1000));
            
            if (elapsed < MIN_DURATION) {
              debugBox.textContent = `🎙️ Grabando (Mínimo: ${remainingSec}s restantes)`;
            } else {
              debugBox.textContent = `🎙️ Escuchando silencio para cortar...`;
            }

            if (elapsed >= MAX_DURATION) {
              stopRecording("Límite máximo");
              return;
            }

            if (elapsed >= MIN_DURATION && analyser) {
              const dataArray = new Uint8Array(analyser.frequencyBinCount);
              analyser.getByteFrequencyData(dataArray);
              let sum = 0;
              for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
              const averageVolume = sum / dataArray.length;

              if (averageVolume < 8) {
                silentFrames++;
                if (silentFrames >= 18) { // ~1.8s de silencio continuo
                  stopRecording("Silencio detectado");
                }
              } else {
                silentFrames = 0;
              }
            }
          }, 100);

          function stopRecording(reason) {
            if (silenceCheckInterval) clearInterval(silenceCheckInterval);
            debugBox.textContent = `⏹️ Guardando (${reason})...`;
            setTimeout(() => { debugBox.style.display = 'none'; }, 2500);
            try {
              if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                if (navigator.vibrate) navigator.vibrate(100);
              }
            } catch(e) {}
          }

        } catch(e) {
          showError("Error al iniciar grabación: " + e.message);
        }
      }

      function resize() {
        dpr = Math.min(devicePixelRatio||1, 2.5);
        cssW = innerWidth; cssH = innerHeight * 3;
        canvas.width = Math.floor(cssW*dpr); canvas.height = Math.floor(cssH*dpr);
        canvas.style.width = cssW+'px'; canvas.style.height = cssH+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        redraw();
      }
      addEventListener('resize', resize);
      resize();

      function clearCanvas() { ctx.fillStyle = '#000'; ctx.fillRect(0,0,cssW,cssH); }
      function drawStroke(pts, color, w) {
        if (!pts || pts.length < 2) return;
        ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(pts[0].x*cssW, pts[0].y*cssH);
        for (let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x*cssW, pts[i].y*cssH);
        ctx.stroke(); ctx.restore();
      }
      function redraw() {
        clearCanvas();
        if (currentPoints.length > 1) {
          const col = stealthMode ? 'rgba(15,15,15,0.3)' : 'rgba(200,200,200,0.85)';
          drawStroke(currentPoints, col, stealthMode ? 2.5 : 3.8);
        }
      }

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)),
          y: Math.max(0, Math.min(1, (e.clientY-r.top)/r.height))
        };
      }

      function send(payload) {
        try { if (bc) bc.postMessage(payload); } catch{}
        try { if (mqttClient && connectedMqtt) mqttClient.publish(TOPIC, JSON.stringify(payload), {qos:0}); } catch(e) {}
      }

      function start(e) {
        if (e.target === ui || ui.contains(e.target)) return;
        if (e.button !== undefined && e.button !== 0) return;
        if (pauseTimer) clearTimeout(pauseTimer);
        activePointers.add(e.pointerId);

        if (activePointers.size >= 2) { drawing = false; currentPoints = []; redraw(); clearTimeout(longPressTimer); return; }

        drawing = true; hasMoved = false; startPos = getPos(e); currentPoints = [startPos];
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          if (drawing && !hasMoved && activePointers.size === 1) {
            drawing = false; currentPoints = []; redraw();
            send({ type: 'stroke', id: 'cmd_option_' + Date.now(), from: CLIENT_ID, isCommand: 'option', points: [] });
            if (navigator.vibrate) navigator.vibrate(70);
          }
        }, 750);
      }

      function move(e) {
        if (activePointers.size >= 2 || !drawing) return;
        const p = getPos(e);
        if (startPos && Math.hypot(p.x - startPos.x, p.y - startPos.y) > 0.015) {
          if (!hasMoved) { hasMoved = true; clearTimeout(longPressTimer); }
        }
        const last = currentPoints[currentPoints.length-1];
        if ((p.x-last.x)**2 + (p.y-last.y)**2 > 0.00003) { currentPoints.push(p); redraw(); }
      }

      function end(e) {
        clearTimeout(longPressTimer);
        const wasTwoFingers = (activePointers.size === 2);
        activePointers.delete(e.pointerId);

        if (wasTwoFingers && activePointers.size === 0 && !hasMoved) {
          drawing = false; currentPoints = []; redraw();
          return;
        }

        if (!drawing) return; 
        drawing = false;

        if (!hasMoved && activePointers.size === 0) {
          const now = Date.now();
          tapTimestamps.push(now);
          tapTimestamps = tapTimestamps.filter(t => now - t < 500);

          if (tapTimestamps.length === 3) {
            tapTimestamps = [];
            send({ type: 'stroke', id: 'cmd_question_' + Date.now(), from: CLIENT_ID, isCommand: 'question', points: [] });
            triggerAudioCapture();
          } else if (tapTimestamps.length === 2) {
            send({ type: 'stroke', id: 'cmd_newline_' + Date.now(), from: CLIENT_ID, isCommand: 'newline', points: [] });
            if (navigator.vibrate) navigator.vibrate(45);
          } else if (tapTimestamps.length === 1) {
            setTimeout(() => {
              if (tapTimestamps.length === 1) {
                tapTimestamps = [];
                send({ type: 'stroke', id: 'cmd_space_' + Date.now(), from: CLIENT_ID, isCommand: 'space', points: [] });
                if (navigator.vibrate) navigator.vibrate(20);
              }
            }, 200);
          }
        }

        if (hasMoved && currentPoints.length >= 2 && activePointers.size === 0) {
          send({
            type: 'stroke',
            id: CLIENT_ID + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6),
            from: CLIENT_ID, points: currentPoints, ts: Date.now()
          });

          if (pauseTimer) clearTimeout(pauseTimer);
          pauseTimer = setTimeout(() => {
            send({ type: 'stroke', id: 'cmd_space_' + Date.now(), from: CLIENT_ID, isCommand: 'space', points: [] });
          }, 700);
        }
        currentPoints = []; redraw();
      }

      canvas.addEventListener('pointerdown', start);
      canvas.addEventListener('pointermove', move);
      canvas.addEventListener('pointerup', end);

      btnStealth.onclick = () => {
        stealthMode = !stealthMode;
        if (stealthMode) { ui.classList.add('hidden'); }
        else { ui.classList.remove('hidden'); }
        redraw();
      };

      try { bc = new BroadcastChannel(BC_NAME); } catch{}

      function connect() {
        try {
          mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            clientId: 'm_'+CLIENT_ID, clean:true, connectTimeout:8000, reconnectPeriod:4000
          });
          mqttClient.on('connect', () => { connectedMqtt=true; mqttClient.subscribe(TOPIC); statusEl.textContent = '•'; });
          mqttClient.on('error', () => { connectedMqtt=false; statusEl.textContent = '…'; });
        } catch(e) {}
      }
      connect();
    })();
  </script>
</body>
</html>
